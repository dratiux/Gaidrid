<style>

     button {
      border: 0;
      border-radius: 4px;
      box-sizing: border-box;
      color: var(--primary-button-text-color);
      cursor: pointer;
      float: right;
      font-size: .875em;
      margin: 0;
      padding: 8px 16px;
      transition: box-shadow 150ms cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    [dir='rtl'] button {
      float: left;
    }

    .bad-clock button,
    .captive-portal button,
    .insecure-form button,
    .lookalike-url button,
    .main-frame-blocked button,
    .neterror button,
    .offline button,
    .pdf button,
    .ssl button,
    .safe-browsing-billing button {
      background: var(--primary-button-fill-color);
    }

    button:active {
      background: var(--primary-button-fill-color-active);
      outline: 0;
    }

    #debugging {
      display: inline;
      overflow: auto;
    }

    .debugging-content {
      line-height: 1em;
      margin-bottom: 0;
      margin-top: 1em;
    }

    .debugging-content-fixed-width {
      display: block;
      font-family: monospace;
      font-size: 1.2em;
      margin-top: 0.5em;
    }

    .debugging-title {
      font-weight: bold;
    }

    #details {
      margin: 0 0 50px;
    }

    #details p:not(:first-of-type) {
      margin-top: 20px;
    }

    .secondary-button:active {
      border-color: white;
      box-shadow: 0 1px 2px 0 rgba(60, 64, 67, .3),
      0 2px 6px 2px rgba(60, 64, 67, .15);
    }

    .secondary-button:hover {
      background: var(--secondary-button-hover-fill-color);
      border-color: var(--secondary-button-hover-border-color);
      text-decoration: none;
    }

    .error-code {
      color: var(--error-code-color);
      font-size: .86667em;
      text-transform: uppercase;
      margin-top: 12px;
    }

    #error-debugging-info {
      font-size: 0.8em;
    }

    h1 {
      color: var(--heading-color);
      font-size: 1.6em;
      font-weight: normal;
      line-height: 1.25em;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 1.2em;
      font-weight: normal;
    }

    .icon {
      height: 72px;
      margin: 0 0 40px;
      width: 72px;
    }

    input[type=checkbox] {
      opacity: 0;
    }

    .interstitial-wrapper {
      box-sizing: border-box;
      font-size: 1em;
      line-height: 1.6em;
      margin: 14vh auto 0;
      max-width: 600px;
      width: 100%;
    }

    #main-message > p {
      display: inline;
    }

    #extended-reporting-opt-in {
      font-size: .875em;
      margin-top: 32px;
    }

    #extended-reporting-opt-in label {
      display: grid;
      grid-template-columns: 1.8em 1fr;
      position: relative;
    }

    #enhanced-protection-message {
      border-radius: 4px;
      font-size: 1em;
      margin-top: 32px;
      padding: 10px 5px;
    }

    #enhanced-protection-message label {
      display: grid;
      grid-template-columns: 2.5em 1fr;
      position: relative;
    }

    #enhanced-protection-message div {
      margin: 0.5em;
    }

    #enhanced-protection-message .icon {
      height: 1.5em;
      vertical-align: middle;
      width: 1.5em;
    }

    .nav-wrapper {
      margin-top: 51px;
    }

    .nav-wrapper::after {
      clear: both;
      content: '';
      display: table;
      width: 100%;
    }

    .small-link {
      color: var(--small-link-color);
      font-size: .875em;
    }

    .checkboxes {
      flex: 0 0 24px;
    }

    .checkbox {
      --padding: .9em;
      background: transparent;
      display: block;
      height: 1em;
      left: -1em;
      padding-inline-start: var(--padding);
      position: absolute;
      right: 0;
      top: -.5em;
      width: 1em;
    }

    .checkbox::after {
      border: 1px solid white;
      border-radius: 2px;
      content: '';
      height: 1em;
      position: absolute;
      top: var(--padding);
      left: var(--padding);
      width: 1em;
    }

    .checkbox::before {
      background: transparent;
      border: 2px solid white;
      border-right-width: 0;
      border-top-width: 0;
      content: '';
      height: .2em;
      left: calc(.3em + var(--padding));
      opacity: 0;
      position: absolute;
      top: calc(.3em  + var(--padding));
      transform: rotate(-45deg);
      width: .5em;
    }

    input[type=checkbox]:checked ~ .checkbox::before {
      opacity: 1;
    }

    #recurrent-error-message {
      background: #ededed;
      border-radius: 4px;
      padding: 12px 16px;
      margin-top: 12px;
      margin-bottom: 16px;
    }

    .showing-recurrent-error-message #extended-reporting-opt-in {
      margin-top: 16px;
    }

    .showing-recurrent-error-message #enhanced-protection-message {
      margin-top: 16px;
    }

    @media (max-width: 700px) {
      .interstitial-wrapper {
        padding: 0 10%;
      }

      #error-debugging-info {
        overflow: auto;
      }
    }

    @media (max-width: 420px) {
      button,
      [dir='rtl'] button,
      .small-link {
        float: none;
        font-size: .825em;
        font-weight: 500;
        margin: 0;
        width: 100%;
      }

      button {
        padding: 16px 24px;
      }

      #details {
        margin: 20px 0 20px 0;
      }

      #details p:not(:first-of-type) {
        margin-top: 10px;
      }

      .secondary-button:not(.hidden) {
        display: block;
        margin-top: 20px;
        text-align: center;
        width: 100%;
      }

      .interstitial-wrapper {
        padding: 0 5%;
      }

      #extended-reporting-opt-in {
        margin-top: 24px;
      }

      #enhanced-protection-message {
        margin-top: 24px;
      }

      .nav-wrapper {
        margin-top: 30px;
      }
    }

      position: fixed;
      right: 0;

    }

      padding-top: 5.5vh;
    }

    button.small-link {
      color: var(--google-blue-600);
    }
  }

  @media (max-width: 420px) and (orientation: portrait),
  (max-height: 560px) {
    body {
      margin: 0 auto;
    }

    button,
    [dir='rtl'] button,
    button.small-link,
    .nav-wrapper .secondary-button {
      font-family: Roboto-Regular,Helvetica;
      font-size: .933em;
      margin: 6px 0;
      transform: translatez(0);
    }

    .nav-wrapper {
      box-sizing: border-box;
      padding-bottom: 8px;
      width: 100%;
    }

    #details {
      box-sizing: border-box;
      height: auto;
      margin: 0;
      opacity: 1;
      transition: opacity 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    #details.hidden,
    #main-content.hidden {
      height: 0;
      opacity: 0;
      overflow: hidden;
      padding-bottom: 0;
      transition: none;
    }

    h1 {
      font-size: 1.5em;
      margin-bottom: 8px;
    }

    .icon {
      margin-bottom: 5.69vh;
    }

    .interstitial-wrapper {
      box-sizing: border-box;
      margin: 7vh auto 12px;
      padding: 0 24px;
      position: relative;
    }

    .interstitial-wrapper p {
      font-size: .95em;
      line-height: 1.61em;
      margin-top: 8px;
    }

    #main-content {
      margin: 0;
      transition: opacity 100ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .small-link {
      border: 0;
    }

    .suggested-left > #control-buttons,
    .suggested-right > #control-buttons {
      float: none;
      margin: 0;
    }
  }

  @media (min-width: 421px) and (min-height: 500px) and (max-height: 560px) {
    .interstitial-wrapper {
      margin-top: 10vh;
    }
  }

  @media (min-height: 400px) and (orientation:portrait) {
    .interstitial-wrapper {
      margin-bottom: 145px;
    }
  }

  @media (min-height: 299px) {
    .nav-wrapper {
      padding-bottom: 16px;
    }
  }

  @media (max-height: 560px) and (min-height: 240px) and (orientation:landscape) {
    .extended-reporting-has-checkbox #details {
      padding-bottom: 80px;
    }
  }

  @media (min-height: 500px) and (max-height: 650px) and (max-width: 414px) and
  (orientation: portrait) {
    .interstitial-wrapper {
      margin-top: 7vh;
    }
  }

  @media (min-height: 650px) and (max-width: 414px) and (orientation: portrait) {
    .interstitial-wrapper {
      margin-top: 10vh;
    }
  }

  /* Small mobile screens. No fixed nav. */
  @media (max-height: 400px) and (orientation: portrait),
  (max-height: 239px) and (orientation: landscape),
  (max-width: 419px) and (max-height: 399px) {
    .interstitial-wrapper {
      display: flex;
      flex-direction: column;
      margin-bottom: 0;
    }

    #details {
      flex: 1 1 auto;
      order: 0;
    }

    #main-content {
      flex: 1 1 auto;
      order: 0;
    }

    .nav-wrapper {
      flex: 0 1 auto;
      margin-top: 8px;
      order: 1;
      padding-left: 0;
      padding-right: 0;
      position: relative;
      width: 100%;
    }

    button,
    .nav-wrapper .secondary-button {
      padding: 16px 24px;
    }

    button.small-link {
      color: var(--google-blue-600);
    }
  }

  @media (max-width: 239px) and (orientation: portrait) {
    .nav-wrapper {
      padding-left: 0;
      padding-right: 0;
    }
  }

  /* download-button shows both icon and text. */
  #download-button {
    padding-bottom: 4px;
    padding-top: 4px;
    position: relative;
  }

  #download-button::before {
    background: -webkit-image-set(
      url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAQAAABKfvVzAAAAO0lEQVQ4y2NgGArgPxIY1YChsOE/LtBAmpYG0mxpIOSDBpKUo2lpIDZxNJCkHKqlYZAla3RAHQ1DFgAARRroHyLNTwwAAAAASUVORK5CYII=) 1x,
      url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAQAAAD9CzEMAAAAZElEQVRYw+3Ruw3AMAwDUY3OzZUmRRD4E9iim9wNwAdbEURHyk4AAAAATiCVK8lLyPsKeT9K3lsownnunfkPxO78hKiYHxBV8x2icr5BVM+/CMf8g3DN34Rzns6ViwHUAUQ/6wIAd5Km7l6c8AAAAABJRU5ErkJggg==) 2x)
    no-repeat;
    content: '';
    display: inline-block;
    height: 24px;
    margin-inline-end: 4px;
    margin-inline-start: -4px;
    vertical-align: middle;
    width: 24px;
  }

  #download-button:disabled {
    background: rgb(180, 206, 249);
    color: rgb(255, 255, 255);
  }

  /*
  TODO(https://crbug.com/852872): UI for offline suggested content is incomplete.
  */
  .suggested-thumbnail {
    height: 25vw;
    width: 25vw;
  }

  /* Alternate dino page button styles */
  #control-buttons .reload-button-alternate:disabled {
    background: #ccc;
    color: #fff;
    font-size: 14px;
    height: 48px;
  }

  #buttons::after {
    clear: both;
    content: '';
    display: block;
    width: 100%;
  }

  /* Offline page */
  html[dir='rtl'] .runner-container,
  html[dir='rtl'].offline .icon-offline {
    transform: scaleX(-1);
  }

  /* ponytail: the 1.5s filter/bg transitions repainted the whole frame every
     frame for 1.5s (40-230ms gaps mid-game). Invert is instant; the runner
     canvas keeps its own .3s filter fade below. */
  .offline {
    will-change: filter, background-color;
  }

  .offline #main-message > p {
    display: none;
  }

  /* iOS WKWebView inverts the background color set at the HTML level
  whereas Blink does not. */
  .offline.inverted {
    filter: invert(1);

    background-color: #000;


  }

  .offline.inverted body {
    background-color: #fff;
  }

  .offline .interstitial-wrapper {
    color: var(--text-color);
    font-size: 1em;
    line-height: 1.55;
    margin: 0 auto;
    max-width: 600px;
    padding-top: 100px;
    width: 100%;
  }

  .offline .runner-container {
    direction: ltr;
    height: 150px;
    max-width: 600px;
    overflow: hidden;
    position: absolute;
    top: 35px;
    width: 44px;
  }

  .offline .runner-container:focus,
  .offline .runner-container:focus-visible {
    outline: none;
  }

  .offline,
  .offline * {
    user-select: none;
    -webkit-user-select: none;
  }

  ::selection {
    background: transparent;
  }

  .offline .runner-canvas {
    height: 150px;
    max-width: 600px;
    opacity: 1;
    overflow: hidden;
    position: absolute;
    top: 0;
    z-index: 10;
  }

  .offline .controller {
    height: 100vh;
    left: 0;
    position: absolute;
    top: 0;
    width: 100vw;
    z-index: 9;
  }

  #offline-resources {
    display: none;
  }

  #offline-instruction {
    image-rendering: pixelated;
    left: 0;
    margin: auto;
    position: absolute;
    right: 0;
    top: 60px;
    width: fit-content;
  }

  .offline-runner-live-region {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
  }

  @media (max-width: 420px) {
    #download-button {
      padding-bottom: 12px;
      padding-top: 12px;
    }

    .suggested-left > #control-buttons,
    .suggested-right > #control-buttons {
      float: none;
    }

    .snackbar {
      border-radius: 0;
      bottom: 0;
      left: 0;
      width: 100%;
    }
  }

  @media (max-height: 350px) {
    h1 {
      margin: 0 0 15px;
    }

    .icon-offline {
      margin: 0 0 10px;
    }

    .interstitial-wrapper {
      margin-top: 5%;
    }

    .nav-wrapper {
      margin-top: 30px;
    }
  }

  @media (min-width: 420px) and (max-width: 736px) and
  (min-height: 240px) and (max-height: 420px) and
  (orientation:landscape) {
    .interstitial-wrapper {
      margin-bottom: 100px;
    }
  }

  @media (max-width: 360px) and (max-height: 480px) {
    .offline .interstitial-wrapper {
      padding-top: 60px;
    }

    .offline .runner-container {
      top: 8px;
    }
  }

  @media (min-height: 240px) and (orientation: landscape) {
    .offline .interstitial-wrapper {
      margin-bottom: 90px;
    }

    .icon-offline {
      margin-bottom: 20px;
    }
  }

  @media (max-height: 320px) and (orientation: landscape) {
    .icon-offline {
      margin-bottom: 0;
    }

    .offline .runner-container {
      top: 10px;
    }
  }

  @media (max-width: 240px) {
    button {
      padding-inline-end: 12px;
      padding-inline-start: 12px;
    }

    .interstitial-wrapper {
      overflow: inherit;
      padding: 0 8px;
    }
  }

  @media (max-width: 120px) {
    button {
      width: auto;
    }
  }

  .arcade-mode,
  .arcade-mode .runner-container,
  .arcade-mode .runner-canvas {
    image-rendering: pixelated;
    max-width: 100%;
    overflow: hidden;
  }

  .arcade-mode #buttons,
  .arcade-mode #main-content {
    opacity: 0;
    overflow: hidden;
  }

  .arcade-mode .interstitial-wrapper {
    height: 100vh;
    max-width: 100%;
    overflow: hidden;
  }

  .arcade-mode .runner-container {
    left: 0;
    margin: auto;
    right: 0;
    transform-origin: top center;
    transition: transform 250ms cubic-bezier(0.4, 0, 1, 1) 400ms;
    z-index: 2;
  }

  .offline .runner-canvas {
    transition: filter .3s ease;
    will-change: filter;
  }

  .icon {
    transition: filter .3s ease;
  }

  html.gaidrid-dark .icon {
    filter: invert(1);
  }

  html.gaidrid-dark.offline .runner-canvas {
    filter: brightness(1.3) saturate(0.85);
  }

  html.gaidrid-dark.offline.inverted {
    filter: invert(0);

    background-color: var(--background-color);


  }

  html.gaidrid-dark.offline.inverted body {
    background-color: #fff;
  }

  html.gaidrid-dark #suggestions-list a {
    color: var(--link-color);
  }

  html.gaidrid-dark #error-information-button {
    filter: invert(0.6);
  }
</style>
